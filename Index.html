<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lua Obfuscator</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:monospace;padding:20px}
textarea{width:100%;height:200px;background:#1e1e1e;color:#0f0;border:1px solid #333;margin-bottom:10px}
button{padding:10px 20px;background:#00ff88;border:none;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<h2>Lua Obfuscator (XOR + Escape)</h2>

<textarea id="input" placeholder="Paste Lua here..."></textarea>
<button onclick="obf()">Obfuscate</button>
<textarea id="output" placeholder="Result..."></textarea>

<script>
function xor(str,key){
  let r="";
  for(let i=0;i<str.length;i++){
    r+=String.fromCharCode(str.charCodeAt(i)^key);
  }
  return r;
}

function toEscapes(str){
  let r="";
  for(let i=0;i<str.length;i++){
    r+="\\"+str.charCodeAt(i);
  }
  return r;
}

function obf(){
  let code=document.getElementById("input").value;
  let x=xor(code,23);
  let esc=toEscapes(x);

  let loader=`local s="${esc}"
local t={}
for n in s:gmatch("\\\\(%d+)") do
 t[#t+1]=string.char(tonumber(n)~23)
end
loadstring(table.concat(t))()`;

  document.getElementById("output").value=loader;
}
</script>

</body>
</html>
