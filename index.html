<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicObfuscator V1.0.2 Lua</title>
    <style>
        :root {
            --bg-color: #0d0614;
            --panel-color: #160d22;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-color: #e0aaff;
            --border-color: #3c165a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin: 30px 0 10px 0;
            text-align: center;
        }

        header h1 {
            color: var(--accent-hover);
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 15px var(--accent-color);
        }

        header p {
            color: #7d7495;
            font-size: 0.95rem;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .panel label {
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-hover);
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 400px;
            background-color: #08030d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-hover);
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5);
        }

        #btnDownload {
            background-color: #3c165a;
            border: 1px solid var(--border-color);
        }

        #btnDownload:hover {
            background-color: #5a2086;
        }
    </style>
</head>
<body>

    <header>
        <h1>MagicObfuscator V1.0.2 Lua/Luau</h1>
        <p>Web MagicObfuscator helps protect your Lua/Luau code</p>
    </header>

    <div class="container">
        <div class="panel">
            <label for="txtOriginal">Mã Nguồn (Source Code)</label>
            <textarea id="txtOriginal" placeholder="Paste Code Here..."></textarea>
        </div>
        <div class="panel">
            <label for="txtObfuscated">Output (Obfuscated Code)</label>
            <textarea id="txtObfuscated" readonly placeholder=""></textarea>
        </div>
    </div>

    <div class="btn-group">
        <button id="btnObfuscate" onclick="processObfuscation()">Obfuscate</button>
        <button id="btnDownload" onclick="downloadFile()">Download</button>
    </div>
<script src="obfuscated.js"></script>
</body>
</html>
