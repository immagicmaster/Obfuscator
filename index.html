<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicObfuscator V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.2rem;
            color: #a78bfa;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Main Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Panel */
        .panel {
            background: #111111;
            border: 1px solid #7c3aed;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s ease;
        }

        .panel:hover {
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .panel-label {
            font-size: 0.9rem;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-label::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            box-shadow: 0 0 8px #8b5cf6;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: #0d0d0d;
            border: 1px solid #4c1d95;
            border-radius: 12px;
            padding: 16px;
            color: #e9d5ff;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
        }

        textarea::placeholder {
            color: #6b7280;
        }

        /* Buttons */
        .buttons-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-obfuscate {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-obfuscate:hover {
            background: #8b5cf6;
            box-shadow: 0 6px 30px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }

        .btn-download {
            background: #1f1f1f;
            color: #a78bfa;
            border: 2px solid #7c3aed;
        }

        .btn-download:hover {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            transform: translateY(-2px);
        }

        .btn-upload {
            background: #1f1f1f;
            color: #c4b5fd;
            border: 2px solid #6d28d9;
        }

        .btn-upload:hover {
            background: #6d28d9;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(109, 40, 217, 0.4);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Status */
        .status {
            text-align: center;
            margin-top: 20px;
            min-height: 24px;
            font-size: 0.95rem;
        }

        .status.success {
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
        }

        .status.error {
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.3);
        }

        .status.loading {
            color: #a78bfa;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #a78bfa;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #6b7280;
            font-size: 0.85rem;
        }

        .footer span {
            color: #7c3aed;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6d28d9;
        }

        /* File input hidden */
        #fileInput {
            display: none;
        }

        /* Glow animation for header */
        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .header h1 {
            animation: glow 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>MagicObfuscator V2</h1>
            <p>The Best Obfuscator</p>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Input Panel -->
            <div class="panel">
                <div class="panel-label">Input</div>
                <textarea id="inputCode" placeholder="-- Paste your Lua code here..."></textarea>
            </div>

            <!-- Output Panel -->
            <div class="panel">
                <div class="panel-label">Output</div>
                <textarea id="outputCode" placeholder="-- Obfuscated code will appear here..." readonly></textarea>
            </div>
        </div>

        <!-- Buttons -->
        <div class="buttons-row">
            <button class="btn btn-obfuscate" id="btnObfuscate" onclick="obfuscate()">
                Obfuscate
            </button>
            <button class="btn btn-download" id="btnDownload" onclick="downloadCode()">
                Download
            </button>
            <button class="btn btn-upload" id="btnUpload" onclick="document.getElementById('fileInput').click()">
                Upload
            </button>
        </div>

        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept=".lua,.txt" onchange="handleFileUpload(event)">

        <!-- Status -->
        <div class="status" id="status"></div>

        <!-- Footer -->
        <div class="footer">
            Powered by <span>MagicAPI</span> &bull; MagicObfuscator V2
        </div>
    </div>

    <script>
        const API_URL = 'https://goofyscator.lua.cz/obfuscate';
        const inputEl = document.getElementById('inputCode');
        const outputEl = document.getElementById('outputCode');
        const statusEl = document.getElementById('status');
        const btnObfuscate = document.getElementById('btnObfuscate');

        function setStatus(msg, type = '') {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }

        function setLoading(loading) {
            btnObfuscate.disabled = loading;
            if (loading) {
                btnObfuscate.innerHTML = '<span class="spinner"></span>Processing...';
            } else {
                btnObfuscate.textContent = 'Obfuscate';
            }
        }

        async function obfuscate() {
            const code = inputEl.value.trim();
            if (!code) {
                setStatus('Please enter some code to obfuscate!', 'error');
                return;
            }

            setLoading(true);
            setStatus('Sending to Goofyscator API...', 'loading');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        'Accept': 'text/plain, application/json'
                    },
                    body: code
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // Try to get response as text first
                const contentType = response.headers.get('content-type') || '';
                let result;

                if (contentType.includes('application/json')) {
                    const json = await response.json();
                    // API might return {code: "..."} or {obfuscated: "..."} or just the code
                    result = json.code || json.obfuscated || json.result || JSON.stringify(json);
                } else {
                    result = await response.text();
                }

                if (!result || result.trim() === '') {
                    throw new Error('API returned empty response');
                }

                outputEl.value = result;
                setStatus('Obfuscation completed successfully!', 'success');

            } catch (error) {
                console.error('Obfuscation error:', error);
                
                // Check if it's a CORS error
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError') || error.message.includes('CORS')) {
                    setStatus(
                        'CORS Error: The API blocks direct browser requests. ' +
                        'You need a backend proxy. Try using a serverless function or local testing.', 
                        'error'
                    );
                } else {
                    setStatus('Error: ' + error.message, 'error');
                }
            } finally {
                setLoading(false);
            }
        }

        function downloadCode() {
            const code = outputEl.value.trim();
            if (!code) {
                setStatus('No code to download!', 'error');
                return;
            }

            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'obfuscated_script.lua';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            setStatus('Downloaded as obfuscated_script.lua', 'success');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                inputEl.value = e.target.result;
                setStatus(`Loaded: ${file.name}`, 'success');
            };
            reader.onerror = function() {
                setStatus('Failed to read file!', 'error');
            };
            reader.readAsText(file);
            
            // Reset input so same file can be selected again
            event.target.value = '';
        }

        // Keyboard shortcut: Ctrl+Enter to obfuscate
        inputEl.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                obfuscate();
            }
        });
    </script>
</body>
</html>
