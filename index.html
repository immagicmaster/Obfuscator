<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicObfuscator V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1300px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #a78bfa, #ddd6fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin-bottom: 6px;
            animation: glow 3s ease-in-out infinite;
        }

        .header p {
            font-size: 1.1rem;
            color: #a78bfa;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
        }

        /* Preset Selector */
        .preset-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .preset-label {
            color: #c4b5fd;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .preset-select {
            background: #111111;
            color: #e9d5ff;
            border: 2px solid #6d28d9;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            min-width: 220px;
            transition: all 0.3s ease;
        }

        .preset-select:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
        }

        .preset-select option {
            background: #111111;
            color: #e9d5ff;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 28px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Panel */
        .panel {
            background: #0f0f0f;
            border: 1px solid #581c87;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 0 25px rgba(88, 28, 135, 0.12),
                        inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .panel:hover {
            box-shadow: 0 0 35px rgba(88, 28, 135, 0.22),
                        inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .panel-label {
            font-size: 0.85rem;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-label::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            box-shadow: 0 0 10px #8b5cf6;
        }

        textarea {
            width: 100%;
            height: 380px;
            background: #080808;
            border: 1px solid #4c1d95;
            border-radius: 12px;
            padding: 16px;
            color: #e9d5ff;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.15);
        }

        textarea::placeholder {
            color: #52525b;
        }

        /* Buttons */
        .buttons-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 38px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-obfuscate {
            background: #6d28d9;
            color: #ffffff;
            box-shadow: 0 4px 22px rgba(109, 40, 217, 0.45);
        }

        .btn-obfuscate:hover {
            background: #7c3aed;
            box-shadow: 0 6px 32px rgba(124, 58, 237, 0.65);
            transform: translateY(-2px);
        }

        .btn-download {
            background: #111111;
            color: #c4b5fd;
            border: 2px solid #6d28d9;
        }

        .btn-download:hover {
            background: #6d28d9;
            color: #ffffff;
            box-shadow: 0 4px 22px rgba(109, 40, 217, 0.45);
            transform: translateY(-2px);
        }

        .btn-upload {
            background: #111111;
            color: #ddd6fe;
            border: 2px solid #5b21b6;
        }

        .btn-upload:hover {
            background: #5b21b6;
            color: #ffffff;
            box-shadow: 0 4px 22px rgba(91, 33, 182, 0.45);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Status */
        .status {
            text-align: center;
            margin-top: 22px;
            min-height: 26px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .status.success {
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.25);
        }

        .status.error {
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.25);
        }

        .status.loading {
            color: #a78bfa;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #a78bfa;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #52525b;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .footer span {
            color: #7c3aed;
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #050505;
        }

        ::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6d28d9;
        }

        /* File input hidden */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MagicObfuscator V2</h1>
            <p>The Best Obfuscator</p>
        </div>

        <div class="preset-bar">
            <span class="preset-label">Preset</span>
            <select class="preset-select" id="presetSelect">
                <option value="">RobloxExecutor</option>
                <option value="Luau">Roblox Studio (Luau)</option>
                <option value="Lua51">Lua 5.1</option>
                <option value="Lua52">Lua 5.2</option>
                <option value="Lua53">Lua 5.3</option>
            </select>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-label">Input</div>
                <textarea id="inputCode" placeholder="-- Paste your Lua code here..."></textarea>
            </div>
            <div class="panel">
                <div class="panel-label">Output</div>
                <textarea id="outputCode" placeholder="-- Obfuscated code will appear here..." readonly></textarea>
            </div>
        </div>

        <div class="buttons-row">
            <button class="btn btn-obfuscate" id="btnObfuscate" onclick="obfuscate()">Obfuscate</button>
            <button class="btn btn-download" id="btnDownload" onclick="downloadCode()">Download</button>
            <button class="btn btn-upload" id="btnUpload" onclick="document.getElementById('fileInput').click()">Upload</button>
        </div>

        <input type="file" id="fileInput" accept=".lua,.txt" onchange="handleFileUpload(event)">
        <div class="status" id="status"></div>

        <div class="footer">
            Powered by <span>MFire API</span> &bull; MagicObfuscator V2
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
