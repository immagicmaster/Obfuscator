<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicObfuscator V1</title>
    <style>
        :root {
            --bg-color: #0d0614;
            --panel-color: #160d22;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-color: #e0aaff;
            --border-color: #3c165a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin: 30px 0 10px 0;
            text-align: center;
        }

        header h1 {
            color: var(--accent-hover);
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 15px var(--accent-color);
        }

        header p {
            color: #7d7495;
            font-size: 0.95rem;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .panel label {
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-hover);
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 400px;
            background-color: #08030d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-hover);
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5);
        }

        #btnDeobfuscate {
            background-color: var(--accent-color);
        }

        #btnDeobfuscate:hover {
            background-color: var(--accent-hover);
        }

        #btnDownload {
            background-color: #3c165a;
            border: 1px solid var(--border-color);
        }

        #btnDownload:hover {
            background-color: #5a2086;
        }

        .file-upload {
            position: relative;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-upload-label {
            display: inline-block;
            background-color: #2a1a3d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            background-color: #3c165a;
            border-color: var(--accent-hover);
        }

        .file-name {
            color: #7d7495;
            font-size: 0.9rem;
            margin-top: 5px;
            text-align: center;
            width: 100%;
        }

        .status {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 5px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>MagicObfuscator V1 Lua/Luau</h1>
        <p>Web MagicObfuscator helps protect your Lua/Luau code</p>
    </header>

    <div class="container">
        <div class="panel">
            <label for="txtOriginal">Mã Nguồn (Source Code)</label>
            <textarea id="txtOriginal" placeholder="Paste Code Here... Hoặc Upload File bên dưới"></textarea>
        </div>
        <div class="panel">
            <label for="txtObfuscated">Output</label>
            <textarea id="txtObfuscated" readonly placeholder="Code đã giải mã sẽ xuất hiện ở đây..."></textarea>
        </div>
    </div>

    <div class="btn-group">
        <div class="file-upload">
            <label class="file-upload-label" id="fileLabel">📁 Chọn File Lua</label>
            <input type="file" id="fileInput" accept=".lua,.luau,.txt" onchange="handleFileSelect(event)">
        </div>
        <button id="btnDeobfuscate" onclick="processDeobfuscation()">Deobfuscate</button>
        <button id="btnDownload" onclick="downloadFile()">Download</button>
    </div>
    <div class="file-name" id="fileName">Chưa chọn file</div>
    <div class="status" id="status"></div>

    <script>
        let selectedFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileName').textContent = "Đã chọn: " + file.name;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('txtOriginal').value = e.target.result;
                };
                reader.readAsText(file);
            }
        }

        async function processDeobfuscation() {
            const output = document.getElementById('txtObfuscated');
            const status = document.getElementById('status');
            const btn = document.getElementById('btnDeobfuscate');

            if (!selectedFile) {
                status.textContent = "Vui lòng chọn file Lua trước!";
                status.style.color = "#ff6b6b";
                return;
            }

            btn.textContent = "Đang giải mã...";
            btn.disabled = true;
            status.textContent = "Đang gửi yêu cầu đến API...";
            status.style.color = "#ffd166";

            try {
                const formData = new FormData();
                formData.append("file", selectedFile, selectedFile.name);

                const response = await fetch("https://dark-rice-4c3a.immagicmaster01.workers.dev/", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Lỗi HTTP: " + response.status);
                }

                const result = await response.text();
                output.value = result;
                status.textContent = "Giải mã thành công!";
                status.style.color = "#06d6a0";

            } catch (error) {
                status.textContent = "Lỗi: " + error.message;
                status.style.color = "#ff6b6b";
                console.error("Deobfuscation error:", error);
            } finally {
                btn.textContent = "Deobfuscate";
                btn.disabled = false;
            }
        }

        function downloadFile() {
            const text = document.getElementById('txtObfuscated').value;
            if (!text) {
                alert("Không có nội dung để tải xuống!");
                return;
            }
            const blob = new Blob([text], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "deobfuscated.lua";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
